app = "cliproxyapi-prod"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DEPLOY = "cloud"

[processes]
  app = "sh -lc 'test -f /data/config.yaml || cp /CLIProxyAPI/config.fly.yaml /data/config.yaml; exec ./CLIProxyAPI --config /data/config.yaml'"

[http_service]
  internal_port = 8317
  force_https = true
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
